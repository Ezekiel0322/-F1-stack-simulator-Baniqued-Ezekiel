
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stack Data Structure Simulator</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="style.css" rel="stylesheet">
</head>

<body>

    <div class="container py-4">

        <h1 class="text-center text-white bg-dark p-3">
            Stack Data Structure Simulator
        </h1>

        <div class="row g-3 mt-2">

            <!-- OPERATIONS -->
            <div class="col-md-4">
                <div class="panel">
                    <h4>Operations</h4>

                    <input
                        type="text"
                        id="dataInput"
                        class="form-control mb-2"
                        placeholder="Enter a value"
                    >

                    <button id="pushBtn" class="btn btn-success w-100 mb-2">
                        Push
                    </button>

                    <button id="popBtn" class="btn btn-danger w-100 mb-2">
                        Pop
                    </button>

                    <button id="peekBtn" class="btn btn-warning w-100 mb-2">
                        Peek
                    </button>

                    <button id="clearBtn" class="btn btn-dark w-100">
                        Clear
                    </button>
                </div>
            </div>

            <!-- STACK DISPLAY -->
            <div class="col-md-4">
                <div class="panel">
                    <h4>Stack Data (TOP → BOTTOM)</h4>
                    <div id="stack" class="structure-area"></div>
                </div>
            </div>

            <!-- DELETED AREA -->
            <div class="col-md-4">
                <div class="panel">
                    <h4>Deleted from Stack</h4>
                    <div id="deleted" class="deleted-area"></div>
                </div>
            </div>

        </div>

        <p id="message" class="text-white text-center mt-3"></p>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="stack.js"></script>

</body>
</html>
